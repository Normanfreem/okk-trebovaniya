<title>Требования ОКК</title>
<meta name="theme-color" content="#1d3a5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f0;--surface:#ffffff;--surface2:#f6f8f7;--ink:#172026;--ink2:#4c5a61;--ink3:#7d8a90;
  --line:#d7dedc;--line2:#bcc6c4;
  --accent:#1d5a9c;--accent-bg:#e3eef9;--accent-ink:#154677;
  --warn:#8a5200;--warn-bg:#fff0cf;--warn-line:#e9c577;
  --ok:#1f6b3f;--ok-bg:#e1f2e7;
  --bad:#a02929;--bad-bg:#fbe5e5;
  --nav:#1d3a5c;--nav-ink:#ffffff;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181c;--surface:#1a2227;--surface2:#212b31;--ink:#e6ecee;--ink2:#a9b6bc;--ink3:#7b8a91;
  --line:#2c383f;--line2:#3b4952;
  --accent:#7db3ea;--accent-bg:#1c3148;--accent-ink:#b9d7f5;
  --warn:#f2c46d;--warn-bg:#3a2c10;--warn-line:#6b5220;
  --ok:#86d3a4;--ok-bg:#15301f;--bad:#f09a9a;--bad-bg:#3a1a1a;
  --nav:#0e2236;--nav-ink:#e6ecee;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c;--surface:#1a2227;--surface2:#212b31;--ink:#e6ecee;--ink2:#a9b6bc;--ink3:#7b8a91;
  --line:#2c383f;--line2:#3b4952;
  --accent:#7db3ea;--accent-bg:#1c3148;--accent-ink:#b9d7f5;
  --warn:#f2c46d;--warn-bg:#3a2c10;--warn-line:#6b5220;
  --ok:#86d3a4;--ok-bg:#15301f;--bad:#f09a9a;--bad-bg:#3a1a1a;
  --nav:#0e2236;--nav-ink:#e6ecee;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);color:var(--nav-ink);padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .crumb{font-size:12px;opacity:.75;font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis}
.ibtn{background:none;border:0;color:inherit;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:focus-visible,.tap:focus-visible,.navb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ibtn svg{width:22px;height:22px}
main{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:14px}
.ver{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2)}
.ver b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.banner{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;width:100%}
.banner.info{border-color:var(--line2);background:var(--accent-bg);color:var(--accent-ink)}
.banner svg{width:20px;height:20px;flex:none}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin:4px 2px -6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tap{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;cursor:pointer;min-height:52px}
.list>.tap:first-child,.list>div:first-child .tap{border-top:0}
.tap:active{background:var(--surface2)}
.tap .t{flex:1;min-width:0}
.tap .t b{font-weight:500;display:block}
.tap .t small{display:block;color:var(--ink2);font-size:13px;margin-top:1px}
.chev{width:18px;height:18px;color:var(--ink3);flex:none}
.cnt{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1;padding:4px 7px;border-radius:6px;white-space:nowrap}
.p-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.p-new{background:var(--ok-bg);color:var(--ok)}
.p-old{background:var(--surface2);color:var(--ink3);border:1px solid var(--line)}
.p-type{background:var(--surface2);color:var(--ink2);border:1px solid var(--line);font-family:var(--mono)}
.sec{display:flex;flex-direction:column;gap:8px}
.sech{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.sech h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--ink2);font-weight:600}
.sech span{font-size:12px;color:var(--ink3)}
.req{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.req.changed{border-color:var(--warn-line);box-shadow:inset 3px 0 0 var(--warn-line)}
.req{scroll-margin-top:64px}.req.hl{outline:2px solid var(--accent);outline-offset:1px}
.req h3{margin:0;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.req h3 .id{font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:400;padding-top:3px}
.kv{display:grid;grid-template-columns:minmax(min(45%,150px),1fr) minmax(0,max-content);gap:0 12px;font-size:14px}
.kv>div{padding:6px 0;border-top:1px dashed var(--line)}
.kv>div:nth-child(-n+2){border-top:0}
.kv .v{text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
[hidden]{display:none!important}
.kv .full{grid-column:1/-1}
.kv .kl{color:var(--ink2);font-size:13px;padding-bottom:0}
.kv .kvl{border-top:0!important;padding-top:1px}
.srcline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.part{display:flex;flex-direction:column;gap:8px}
.part+.part{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.kvg{background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kvg .gh{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:6px 10px;border-bottom:1px solid var(--line2)}
.kvg table{width:100%;border-collapse:collapse;font-size:14px}
.kvg td{padding:6px 10px;vertical-align:top}
.kvg tr+tr td{border-top:1px solid var(--line)}
.src.sm{padding:4px 8px;font-size:12px;white-space:nowrap;font-family:var(--sans)}
.wel{font-weight:500}
.kvg .gk{font-size:13px;color:var(--ink2)}.kvg .gv{font-size:14px;margin-top:2px}
.kvg td.li{padding-left:22px;position:relative}
.kvg td.li::before{content:'';position:absolute;left:10px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.kvg td.v{text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.srcs{display:flex;flex-direction:column;gap:6px;width:100%}
.srcs .src{width:100%;align-self:stretch}
.src{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--accent-bg);color:var(--accent-ink);border:0;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left}
.src svg{width:16px;height:16px;flex:none}
.src .pg{font-family:var(--mono);font-size:12px;opacity:.8}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note{font-size:13px;color:var(--ink2)}
details.old{border-top:1px solid var(--line);padding-top:8px}
details.old summary{cursor:pointer;font-size:13px;color:var(--ink2)}
details.old .kv{opacity:.75;text-decoration:line-through;text-decoration-color:var(--ink3);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.navb{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);cursor:pointer;position:relative}
.navb svg{width:22px;height:22px}
.navb.on{color:var(--accent)}
.navb .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--warn-line);color:#3d2700;font-size:10px;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:500}
.btn.pri{background:var(--nav);border-color:var(--nav);color:var(--nav-ink)}
.btn svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.stat small{color:var(--ink2);font-size:12px}
.msg{font-size:13px;padding:8px 10px;border-radius:8px}
.m-err{background:var(--bad-bg);color:var(--bad)}
.m-warn{background:var(--warn-bg);color:var(--warn)}
.m-ok{background:var(--ok-bg);color:var(--ok)}
.chg{display:flex;flex-direction:column;gap:4px;font-size:14px}
.chg .was{text-decoration:line-through;color:var(--ink3);font-size:13px}
.path{font-size:12px;color:var(--ink3)}
.empty{text-align:center;color:var(--ink2);padding:24px 8px;font-size:14px}
.pdfbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.pdfbar .sp{flex:1}
.pdfbar button{border:1px solid var(--line2);background:var(--surface);border-radius:8px;height:34px;min-width:38px;cursor:pointer}
.pages{display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.page{background:#fff;border:1px solid var(--line);position:relative;margin:0 auto;scroll-margin-top:64px}
.page canvas{display:block;width:100%;height:100%}
.page .no{position:absolute;right:6px;top:6px;font:11px var(--mono);background:rgba(23,32,38,.7);color:#fff;padding:2px 6px;border-radius:4px}
.page.target{outline:3px solid var(--warn-line)}
.doctext{font-size:14px;white-space:pre-wrap;line-height:1.5}
mark{background:var(--warn-bg);color:inherit;padding:0 1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.brand{display:none}
@media (min-width:1000px){
  body{padding-left:240px}
  body.side-open{padding-right:min(48vw,860px)}
  .app{max-width:1180px}
  body.wide .app{max-width:none}
  .top{padding:12px 32px;min-height:60px}
  .top h1{font-size:19px}
  main{padding:22px 32px 48px;gap:16px}
  .nav{left:0;top:0;bottom:0;right:auto;width:240px;border-top:0;border-right:1px solid var(--line);padding:0;overflow:auto}
  .nav .in{display:flex;flex-direction:column;gap:2px;padding:0 10px 16px;max-width:none}
  .brand{display:block;font-weight:600;font-size:16px;padding:18px 12px 16px;color:var(--ink)}
  .brand small{display:block;font-weight:400;font-size:12px;color:var(--ink3);margin-top:2px;font-family:var(--mono)}
  .navb{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px;border-radius:8px;color:var(--ink2)}
  .navb:hover{background:var(--surface2)}
  .navb.on{background:var(--accent-bg);color:var(--accent-ink)}
  .navb .dot{position:static;order:3;margin-left:auto}
  .blk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
  .blk.two{grid-template-columns:repeat(2,minmax(0,1fr));width:calc((100% - 24px) * 2 / 3 + 12px);align-self:center}
  .blk .req{height:100%;box-sizing:border-box}
  .blk>.sech{grid-column:1/-1}
  body.side-open .blk,body.side-open .blk.two{grid-template-columns:1fr;width:auto}
  .list,.card,.search,.ver,.stat,.banner,.btn,.msg{max-width:900px}
  .tap:hover{background:var(--surface2)}
  .src:hover{filter:brightness(.96)}
  .side{position:fixed;top:0;right:0;bottom:0;width:min(48vw,860px);background:var(--bg);border-left:1px solid var(--line2);z-index:7;display:flex;flex-direction:column}
  .side .sh{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px;background:var(--nav);color:var(--nav-ink);min-height:60px}
  .side .st{flex:1;min-width:0}.side .st b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .crumb{display:block;font-size:12px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .sb{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  .side .page{scroll-margin-top:8px}
}
@media (max-width:999px){.side{display:none!important}}
.mtab{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mbar{display:flex;justify-content:flex-end;margin:0 0 10px}
.xbtn{display:inline-flex;align-items:center;gap:8px;background:#1f6f43;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.xbtn svg{width:18px;height:18px}.xbtn:active{opacity:.85}
.mtab-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 14px}
.mtab-h h3{margin:0;font-size:15px;font-weight:600}.mtab-h span{font-size:12px;color:var(--ink3)}
.mtab table{width:100%;border-collapse:collapse}
.mtab th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);background:var(--surface2);border-bottom:1px solid var(--line2);padding:10px 12px;vertical-align:bottom}
.mtab td{border-top:1px solid var(--line);padding:10px 12px;font-size:14px;vertical-align:top}
.mtab td.mv{font-family:var(--mono);font-size:13px}
.mtab-w{overflow-x:auto}
.mtab th.mw,.mtab td.mw{min-width:200px;width:22%}
.mtab td.mv{white-space:normal;min-width:90px}
.mgo{background:none;border:0;padding:0;font:inherit;font-weight:500;color:var(--ink);text-align:left;cursor:pointer}
.mgo:hover{color:var(--accent)}
.mdocs{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.mdocs .src{width:auto}
@media (max-width:999px){
  .mtab thead{display:none}
  .mtab table,.mtab tbody,.mtab tr,.mtab td{display:block;width:auto}
  .mtab tr{border-top:1px solid var(--line2);padding:6px 0}
  .mtab td{border-top:0;padding:4px 14px;display:flex;justify-content:space-between;gap:12px}
  .mtab td::before{content:attr(data-l);font-family:var(--sans);font-size:13px;color:var(--ink2);flex:none;max-width:50%}
  .mtab td.mw{display:block}.mtab td.mw::before{display:none}
  .mtab td.mv{text-align:right}
  .mtab td.em{display:none}
  .mtab th.mw,.mtab td.mw{min-width:0;width:auto}
}



/* ===== E: страница-справочник конструктива ===== */
body.ve main{max-width:none}
.pg{display:flex;flex-direction:column;gap:14px}
.pgh .cr{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.pgh h1{margin:4px 0 0;font-size:24px;line-height:1.2;font-weight:600}
.pgh .srcb{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;background:var(--surface)}
.pbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:4;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px}
.pbar .search{border-width:1.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line2);background:var(--surface);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--nav);border-color:var(--nav);color:var(--nav-ink)}
@media (max-width:999px){.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.chips button{flex:none;white-space:nowrap}}
.pgrid{display:block}
.ptoc{display:none}
.psec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:130px}
.psec>h2{margin:10px 0 0;font-size:18px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.psec>h2 small{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink3)}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;scroll-margin-top:130px}
.pc.bad{box-shadow:inset 3px 0 0 #c43a3a}
.pc.hl{outline:2px solid var(--accent);outline-offset:1px}
.pch{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.pch .n{font-family:var(--mono);font-size:12px;color:var(--ink2);border:1px solid var(--line2);border-radius:4px;padding:2px 6px;flex:none;margin-top:2px}
.pch h3{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.pch .sub{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5}
.tagbad{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#b02a2a;background:#fbe3e3;border-radius:4px;padding:2px 7px}
.pcb{display:flex;flex-direction:column}
.pcl{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcl .ph{font-weight:600;font-size:14px;margin-top:4px}
.pcl .ph:first-child{margin-top:0}
.pcl .pn{font-size:12.5px;color:var(--ink2)}
.pcr{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.pcr .cap{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.dt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;cursor:pointer;width:100%;color:var(--ink)}
.dt:hover{border-color:var(--accent)}
.dt .bd{flex:none;font-family:var(--mono);font-size:10px;font-weight:600;color:#fff;background:var(--nav);border-radius:3px;padding:2px 4px;margin-top:2px}
.dt .bd.no{background:var(--ink3)}
.dt b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.dt small{display:block;font-size:11.5px;color:var(--ink2);line-height:1.35;margin-top:2px}
.dt i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--accent)}
.preg{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.preg table{width:100%;border-collapse:collapse}
.preg td{border-top:1px solid var(--line);padding:8px 12px;vertical-align:top;font-size:13.5px}
.preg tr:first-child td{border-top:0}
.preg td:first-child{width:38%}
.preg a{display:block;color:var(--accent-ink);font-size:13px;padding:1px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pfoot{font-size:12px;color:var(--ink3)}

function parseWorkbook(buf){
  const errs=[];
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const sR=findSheet(wb,'Требования'), sD=findSheet(wb,'Документы'), sI=findSheet(wb,'Инфо');
  if(!sR){errs.push({lvl:'err',t:'Нет листа «Требования». Проверьте название листа.'});return {errs};}
  const R=mapRows(wb.Sheets[sR],REQ_COLS,'Требования',errs);
  for(const k of ['id','kon','text','doc']) if(R.idx[k]<0) errs.push({lvl:'err',t:`Лист «Требования»: нет столбца «${{id:'ID',kon:'Конструктив',text:'Требование',doc:'Документ'}[k]}»`});
  if(errs.some(e=>e.lvl==='err')) return {errs};
  let docs=[];
  if(sD){docs=mapRows(wb.Sheets[sD],DOC_COLS,'Документы',errs).rows.map(d=>({code:String(d.code).trim(),type:String(d.type).trim(),name:String(d.name).trim(),date:fmtDate(d.date),file:String(d.file).trim(),text:String(d.text).trim(),_row:d._row})).filter(d=>d.code);}
  else errs.push({lvl:'warn',t:'Нет листа «Документы» — ссылки на PDF работать не будут'});
  let asof='';
  if(sI){const a=XLSX.utils.sheet_to_json(wb.Sheets[sI],{header:1,defval:'',raw:true});for(const r of a){if(norm(r[0]).startsWith('актуально')) asof=fmtDate(r[1]);}}
  if(!asof) errs.push({lvl:'warn',t:'На листе «Инфо» не заполнено «Актуально на»'});
  const reqs=R.rows.map(o=>({
    id:String(o.id).trim(),obj:String(o.obj).trim()||'Без объекта',kon:String(o.kon).trim(),el:String(o.el).trim()||String(o.kon).trim(),
    block:String(o.block).trim()||'Прочее',mat:String(o.mat).trim(),cat:String(o.cat||'').trim(),text:String(o.text).trim(),doc:String(o.doc).trim(),
    page:parseInt(o.page,10)||1,status:norm(o.status).startsWith('замен')?'old':'active',repl:String(o.repl).trim(),
    date:fmtDate(o.date),note:String(o.note).trim(),_row:o._row}));
  for(const q of reqs){
    const cs=q.doc.split(/\s*[;\n]\s*/).filter(Boolean); const ps=String(R.rows.find(o=>o._row===q._row).page).split(/\s*[;,\n]\s*/);
    q.docs=cs.map((c,i)=>({code:c,page:parseInt(ps[i]!==undefined?ps[i]:ps[ps.length-1],10)||1}));
    q.doc=cs[0]||''; q.page=q.docs[0]?q.docs[0].page:1;
  }
  const ids=new Map(); const codes=new Set(docs.map(d=>d.code));
  for(const q of reqs){
    if(!q.id) errs.push({lvl:'warn',t:`Требования, строка ${q._row}: нет ID`});
    else if(ids.has(q.id)) errs.push({lvl:'warn',t:`Требования, строка ${q._row}: ID ${q.id} повторяется (строка ${ids.get(q.id)})`});
    else ids.set(q.id,q._row);
    if(!q.kon) errs.push({lvl:'warn',t:`Требования, строка ${q._row}: не указан конструктив`});
    for(const x of q.docs) if(docs.length&&!codes.has(x.code)) errs.push({lvl:'warn',t:`Требования, строка ${q._row}: документ «${x.code}» не найден на листе «Документы»`});
    if(!q.doc) errs.push({lvl:'warn',t:`Требования, строка ${q._row}: не указан документ`});
  }
  for(const q of reqs) if(q.repl&&!ids.has(q.repl)) errs.push({lvl:'warn',t:`Требования, строка ${q._row}: «Заменено на» ${q.repl} — такого ID нет`});
  return {reqs,docs,asof,errs};
}

/* ---------- импорт ---------- */
const cp866=(()=>{let u8=null,d=null;try{u8=new TextDecoder('utf-8',{fatal:true});}catch(e){}try{d=new TextDecoder('ibm866');}catch(e){}if(!d)return null;return b=>{if(u8){try{return u8.decode(b);}catch(e){}}return d.decode(b);};})();
const base=n=>String(n).split(/[\\/]/).pop();
async function importFiles(files){
  const out={xlsx:null,xname:'',pdfs:[]};
  for(const f of files){
    const n=f.name.toLowerCase();
    if(n.endsWith('.zip')){
      const opt=cp866?{decodeFileName:cp866}:{};
      const z=await JSZip.loadAsync(await f.arrayBuffer(),opt);
      for(const name of Object.keys(z.files)){
        const e=z.files[name]; if(e.dir) continue; const b=base(name); const bl=b.toLowerCase();
        if(b.startsWith('~$')||b.startsWith('.')) continue;
        if(bl.endsWith('.xlsx')&&!out.xlsx){out.xlsx=await e.async('arraybuffer');out.xname=b;}
        else if(bl.endsWith('.pdf')) out.pdfs.push({name:b,blob:await e.async('blob')});
      }
    }else if(n.endsWith('.xlsx')){out.xlsx=await f.arrayBuffer();out.xname=f.name;}
    else if(n.endsWith('.pdf')) out.pdfs.push({name:f.name,blob:f});
  }
  let prev=await get('kv','data');
  if(prev&&prev.demo&&out.xlsx&&!files.some(f=>f.name==='пример.zip')){await clearAll();prev=null;}
  const have=await pdfKeys();
  const res={errs:[],pdfNew:[],pdfSkip:[],diff:null,xname:out.xname};
  let data=prev;
  if(out.xlsx){
    const p=parseWorkbook(out.xlsx); res.errs=p.errs;
    if(p.errs.some(e=>e.lvl==='err')){res.failed=true;return res;}
    res.diff=makeDiff(prev,p);
    data={reqs:p.reqs,docs:p.docs,asof:p.asof,loadedAt:Date.now(),prevAsof:prev?prev.asof:'',diff:res.diff,warns:p.errs};
  }
  for(const p of out.pdfs){
    const k=p.name.toLowerCase();
    if(have.has(k)&&p.blob.size===((await get('pdf',k))||{}).size) res.pdfSkip.push(p.name);
    else{await put('pdf',k,p.blob);res.pdfNew.push(p.name);}
  }
  if(!out.xlsx&&!out.pdfs.length){res.failed=true;res.errs=[{lvl:'err',t:'В выбранных файлах нет ни Excel (.xlsx), ни PDF'}];return res;}
  if(!data){res.failed=true;res.errs.push({lvl:'err',t:'Сначала загрузите Excel с требованиями'});return res;}
  data.lastImport={at:Date.now(),pdfNew:res.pdfNew,xname:out.xname};
  await put('kv','data',data);
  return res;
}
function sig(q){return [q.text,q.status,(q.docs||[]).map(x=>x.code+':'+x.page).join(','),q.el,q.block,q.mat].join('|');}
function makeDiff(prev,next){
  if(!prev) return {first:true,added:[],changed:[],removed:[]};
  const pm=new Map(prev.reqs.map(q=>[q.id,q])); const nm=new Map(next.reqs.map(q=>[q.id,q]));
  const added=[],changed=[],removed=[];
  for(const q of next.reqs){const o=pm.get(q.id); if(!o) added.push(q.id); else if(sig(o)!==sig(q)) changed.push({id:q.id,was:o.text,wasStatus:o.status});}
  for(const q of prev.reqs) if(!nm.has(q.id)) removed.push({id:q.id,text:q.text,kon:q.kon,el:q.el});
  // новая строка, заменившая старую, показывается как «изменено: было → стало»
  const out=[],skip=new Set();
  for(const id of added){
    const old=next.reqs.find(q=>q.repl===id&&pm.has(q.id));
    if(old){changed.push({id,was:pm.get(old.id).text});skip.add(old.id);} else out.push(id);
  }
  return {first:false,added:out,changed:changed.filter(c=>!skip.has(c.id)),removed,fromAsof:prev.asof};
}

function keyVals(rows){
  const out=[];const add=(k,v,q)=>{v=shortV(v);if(!v)return;const f=out.find(x=>x.k===k&&x.v===v);if(f){if(q.mat&&!f.subs.includes(q.mat))f.subs.push(q.mat);}else out.push({k,v,subs:q.mat?[q.mat]:[],id:q.id});};

  }

}

    m=p.match(/^([^:]{2,60}):\s+(.+?)\s+[-–—]\s+(.+)$/);

  const fit=(ids,pick)=>{const off=ids.map(i=>pick(i).getBoundingClientRect().top-cards[i].getBoundingClientRect().top);const mx=Math.max(...off);
    ids.forEach((i,j)=>{if(mx-off[j]>0.5){const l=pick(i);l.style.marginTop=((parseFloat(l.style.marginTop)||0)+mx-off[j])+'px';}});};

    if(ids.every(i=>L[i].length===n)){for(let j=0;j<n;j++) fit(ids,i=>L[i][j]);}

}

      const base={font:{name:F,sz:10,color:{rgb:INK}},fill:{fgColor:{rgb:z}},border:bd,alignment:{vertical:'top',wrapText:true}};
      const ctr={...base,alignment:{...base.alignment,horizontal:'center'}};
      const vals=[[i+1,{...ctr,font:{...base.font,color:{rgb:MUT}}}],...(KON?[[r.q.kon,base]]:[]),[r.q.el,{...base,font:{...base.font,bold:true}}],[r.q.mat,base],
        ...cols.map(c=>d.has(c)?[d.get(c),ctr]:['—',{...ctr,font:{...base.font,color:{rgb:'A0ACB2'}}}]),
        [seen.map(x=>x.code).join('\n'),{...base,font:{...base.font,color:{rgb:BLUE}}}],

      vals.forEach(([v],ci)=>{const mx=String(v).split('\n').reduce((m,x)=>Math.max(m,x.length),0);W[ci]=Math.max(W[ci],Math.min(mx+2,cap[ci]));});

  if(tables.length===1) XLSX.utils.book_append_sheet(wb,sheet(tables[0],name+' — требования ОКК'),sn(name));
  else tables.forEach(t=>XLSX.utils.book_append_sheet(wb,sheet(t,name+' — '+(t.title||'')),sn(t.title)));

  const fn=(name+(D.asof?'_'+D.asof:'')).replace(/[\\/:*?"<>|]/g,'_')+'.xlsx';

}

let pdfLibReady=null;
function pdfLib(){

  pdfLibReady=(async()=>{
    const L=window.pdfjsLib; if(!L) throw new Error('Модуль PDF не загрузился');
    try{const blob=new Blob([`importScripts(${JSON.stringify(PDF_WORKER)});`],{type:'application/javascript'});L.GlobalWorkerOptions.workerPort=new Worker(URL.createObjectURL(blob));}
    catch(e){L.GlobalWorkerOptions.workerSrc=PDF_WORKER;}

  })();
  return pdfLibReady;
}

async function pdfInto(m,v,alive){
  const d=docBy(v.doc);
  if(!hasPdf(d)){m.innerHTML=`<div class="msg m-warn">PDF для «${esc(v.doc)}» не загружен. На листе «Документы» указан файл «${esc(d&&d.file||'—')}».</div>${d&&d.text?`<div class="card doctext">${esc(d.text)}</div>`:''}`;return;}
  m.innerHTML=`<div class="pdfbar"><span class="pinfo">Открываю…</span><span class="sp"></span><button class="zo" aria-label="Уменьшить">−</button><button class="zi" aria-label="Увеличить">+</button></div><div class="pages"></div>`;
  try{
    const L=await pdfLib();
    const blob=await get('pdf',d.file.toLowerCase());
    const doc=await L.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    if(!alive()) return;
    let zoom=1; const box=m.querySelector('.pages');
    const target=Math.min(Math.max(1,v.page),doc.numPages);
    m.querySelector('.pinfo').textContent=`Стр. ${target} из ${doc.numPages}`;
    const vps=[]; for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);vps.push(p.getViewport({scale:1}));}
    const draw=()=>{
      const W=Math.max(200,(box.clientWidth||m.clientWidth))*zoom;
      box.innerHTML=vps.map((vp,i)=>`<div class="page${i+1===target?' target':''}" data-n="${i+1}" style="width:${W}px;height:${Math.round(W*vp.height/vp.width)}px"><canvas></canvas><span class="no">${i+1}</span></div>`).join('');
      const io=new IntersectionObserver(es=>es.forEach(async e=>{if(!e.isIntersecting||e.target.dataset.done)return;e.target.dataset.done=1;io.unobserve(e.target);
        const n=+e.target.dataset.n;const p=await doc.getPage(n);const sc=W/vps[n-1].width*(window.devicePixelRatio||1);const vp=p.getViewport({scale:sc});const c=e.target.querySelector('canvas');c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;}),{rootMargin:'400px'});
      box.querySelectorAll('.page').forEach(el=>io.observe(el));
      const t=box.querySelector('.page.target'); if(t) setTimeout(()=>t.scrollIntoView({block:'start'}),30);
    };
    draw();
    m.querySelector('.zi').onclick=()=>{zoom=Math.min(6,zoom*1.5);draw();};
    m.querySelector('.zo').onclick=()=>{zoom=Math.max(1,zoom/1.5);draw();};
  }catch(e){m.innerHTML=`<div class="msg m-err">Не удалось открыть PDF: ${esc(e.message||e)}</div>`;}
}

  else h+=`<button class="btn pri" id="up">${I.upload}Загрузить обновление</button><div class="note">Выберите архив .zip из чата или Excel и PDF по отдельности. Можно несколько файлов сразу.</div>`;
  h+=`<div class="lbl">PDF в телефоне</div><div class="list">`+need.map(d=>`<div class="tap" style="cursor:default"><span class="t"><b>${esc(d.file)}</b><small>${esc(d.code)}</small></span>${hasPdf(d)?'<span class="pill p-new">есть</span>':'<span class="pill p-warn">нет</span>'}</div>`).join('')+`</div>`;
  if(D.warns&&D.warns.length) h+=`<div class="lbl">Замечания к таблице</div>`+D.warns.map(e=>`<div class="msg m-warn">${esc(e.t)}</div>`).join('');
  if(!REMOTE.on) h+=`<button class="btn" id="demo">Сбросить и открыть пример</button>`;
  $('main').innerHTML=h;
  if($('up')) $('up').onclick=pick; if($('demo')) $('demo').onclick=loadDemo;
  if($('sync')) $('sync').onclick=async()=>{$('syncmsg').textContent='Проверяю…';const r=await syncRemote(true);if(r==='same')$('syncmsg').textContent='У вас последняя версия.';else if(r==='offline')$('syncmsg').textContent='Нет связи. Попробуйте позже.';};
}

/* ---------- обновление с сервера (зашифрованный data.okk) ---------- */
const REMOTE={on:false,ver:null};
async function fetchVer(){
  if(!/^https?:/.test(location.protocol)) return 'none';
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(r.status===404) return 'none'; if(!r.ok) return 'offline'; const v=await r.json(); if(!v||!v.id) return 'none'; REMOTE.on=true; REMOTE.ver=v; try{localStorage.setItem('okk-remote','1')}catch(e){} return v;}
  catch(e){return 'offline';}
}
async function decryptOkk(buf,pwd){
  const u=new Uint8Array(buf);
  if(String.fromCharCode(...u.slice(0,4))!=='OKK1') throw new Error('bad');
  const salt=u.slice(4,20), iv=u.slice(20,32), ct=u.slice(32);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
}
async function syncRemote(manual,pwdIn){
  const v=await fetchVer();
  if(v==='none'||v==='offline') return v;
  if(D&&D.remoteId===v.id&&!pwdIn){D.syncedAt=Date.now();await put('kv','data',D);return 'same';}
  const pwd=pwdIn||await get('kv','pwd');
  if(!pwd){S.gate={};render();return 'need';}
  let buf; try{const r=await fetch('data.okk?v='+encodeURIComponent(v.id),{cache:'no-store'}); if(!r.ok) throw 0; buf=await r.arrayBuffer();}catch(e){return 'offline';}
  let zip; try{zip=await decryptOkk(buf,pwd);}catch(e){await put('kv','pwd',null);S.gate={err:pwdIn?'Неверный пароль':'Пароль изменился. Введите новый пароль.'};render();return 'badpwd';}
  const r=await importFiles([new File([zip],'data.zip')]);
  if(!r.failed){const d=await get('kv','data');d.remoteId=v.id;d.syncedAt=Date.now();d.demo=false;await put('kv','data',d);await put('kv','pwd',pwd);}
  await reload(); S.gate=null; S.tab='home'; S.stack=[{v:'imp',r}]; render(); window.scrollTo(0,0);
  return 'updated';
}
function vGate(){
  setTop('Требования ОКК');
  const g=S.gate||{};
  $('main').innerHTML=`<div class="card"><div style="font-weight:500;margin-bottom:6px">Вход</div><div class="note">Введите пароль, который выдал ответственный ОКК. Вводится один раз, дальше данные обновляются сами.</div></div>
  <form id="gf" class="sec" autocomplete="off"><label class="search"><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <div id="pwerr" class="msg m-err" ${g.err?'':'hidden'}>${esc(g.err||'')}</div>
  <button class="btn pri" id="go" type="submit">Войти</button></form>`;
  $('pw').oninput=()=>{$('pwerr').hidden=true;};
  $('gf').onsubmit=async e=>{e.preventDefault();const p=$('pw').value.trim();if(!p){$('pwerr').textContent='Введите пароль';$('pwerr').hidden=false;return;}
    $('go').textContent='Загружаю данные…';const r=await syncRemote(true,p);
    if(r==='offline'){$('go').textContent='Войти';$('pwerr').textContent='Нет связи с сервером. Проверьте интернет.';$('pwerr').hidden=false;}};
}
function vNoNet(){
  setTop('Требования ОКК');
  $('main').innerHTML=`<div class="empty">Для первой загрузки данных нужен интернет.</div><button class="btn pri" id="rt">Повторить</button>`;
  $('rt').onclick=start;
}

/* ---------- старт ---------- */
async function start(){
  try{await reload();}catch(e){}
  let remoteKnown=false; try{remoteKnown=localStorage.getItem('okk-remote')==='1'}catch(e){}
  if(D&&!D.demo){render(); syncRemote(false); return;}
  const r=await syncRemote(false);
  if(r==='updated'||r==='need'||r==='badpwd') return;
  if(r==='offline'&&(remoteKnown||/github\.io$/.test(location.hostname))){vNoNet();return;}
  if(!D){try{await loadDemo();return;}catch(e){}}
  render();
}
start();
})();
</script>
